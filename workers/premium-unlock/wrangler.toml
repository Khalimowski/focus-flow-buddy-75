name = "focus-flow-premium-unlock"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Play package name (matches applicationId in android/app/build.gradle).
PLAY_PACKAGE_NAME = "com.khalimowski.focusflow"

# Where the browser build lives — this is the link that gets emailed.
APP_URL = "https://flowday.day/"

# Origins allowed to call this Worker. Capacitor's webview reports
# https://localhost; add every domain that serves the app. These are matched
# against the Origin header verbatim, so no trailing slashes.
ALLOWED_ORIGINS = "https://flowday.day,https://focus-flow-buddy-75.kacper-szymanski1990.workers.dev,https://focus-flow-buddy-75.lovable.app,https://localhost,http://localhost:8080"

MAIL_FROM = "FlowDay <noreply@focusflow.app>"

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   GOOGLE_SERVICE_ACCOUNT_JSON   full service-account JSON with androidpublisher access
#   RESEND_API_KEY                Resend API key used to send the welcome email
