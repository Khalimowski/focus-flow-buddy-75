# Builds the app and uploads a signed .aab to Google Play.
#
# Triggers: pushing a tag like v1.2 (publishes to the internal track), or
# manually from the Actions tab with a track of your choice.
#
# Required repository secrets (see docs/play-publishing.md for setup):
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
#   PLAY_SERVICE_ACCOUNT_JSON  Play API service-account JSON (full contents)
#
# The signing preflight runs before the web and Gradle builds on purpose: a
# missing or malformed secret used to surface four minutes in, as an opaque
# ":app:signReleaseBundle FAILED ... Tag number over 30 is not supported".

name: Publish to Google Play

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to publish to"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Fail fast, and say which secret is at fault. Nothing here prints a
      # secret: the only value echoed back is the list of aliases the keystore
      # actually contains, which is what you need to fix a mismatch.
      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          missing=""
          [ -n "$KEYSTORE_B64" ]  || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]     || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]  || missing="$missing ANDROID_KEY_PASSWORD"
          [ -n "$PLAY_JSON" ]     || missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secret(s):$missing"
            echo "Set them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Strip whitespace before decoding. A keystore pasted with line wraps
          # or CRLF endings decodes into garbage that only fails much later,
          # inside bundletool, as an ASN.1 parse error.
          KS="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KS" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
            echo "Regenerate it with: base64 -w 0 upload-keystore.jks"
            exit 1
          }

          if [ ! -s "$KS" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" > /tmp/keystore-list.txt 2>&1; then
            echo "::error::Could not read the keystore. Either ANDROID_KEYSTORE_BASE64 does not decode to a valid .jks/.p12, or ANDROID_KEYSTORE_PASSWORD is wrong."
            echo "keytool said:"
            sed 's/^/  /' /tmp/keystore-list.txt
            echo "Regenerate the secret with: base64 -w 0 upload-keystore.jks"
            exit 1
          fi

          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Key alias '$KEY_ALIAS' is not in the keystore."
            echo "Aliases this keystore contains:"
            grep -i "PrivateKeyEntry\|trustedCertEntry" /tmp/keystore-list.txt | sed 's/^/  /' || true
            exit 1
          fi

          echo "Keystore parses and contains alias '$KEY_ALIAS'."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun.lock pins tarballs to Lovable's private registry, which CI can't
      # reach — resolve from the public npm registry instead.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # patches/ is wired up through bun's `patchedDependencies`, which npm
      # ignores entirely — so apply it by hand here. Without this the admob
      # plugin still calls getDefaultProguardFile('proguard-android.txt'),
      # which AGP 9 rejects, and :capacitor-community-admob fails to
      # configure before anything is compiled.
      - name: Apply dependency patches
        run: |
          set -euo pipefail
          cd node_modules/@capacitor-community/admob
          if grep -q "proguard-android-optimize.txt" android/build.gradle; then
            echo "admob patch already applied; skipping."
          else
            # --forward alone still exits 1 on an already-patched tree, so the
            # grep above is what makes this re-runnable against a warm cache.
            patch -p1 < "$GITHUB_WORKSPACE/patches/@capacitor-community%2Fadmob@8.0.0.patch"
          fi
          grep -q "proguard-android-optimize.txt" android/build.gradle || {
            echo "::error::admob proguard patch did not apply; :capacitor-community-admob will fail to configure under AGP 9."
            exit 1
          }

      - name: Build web bundle
        run: npm run build

      # Same steps as sync-android.bat: stage dist/client into the Android
      # project's assets and let Capacitor sync plugin config.
      - name: Stage web assets into the Android project
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          if [ -f dist/client/_shell.html ]; then cp dist/client/_shell.html dist/client/index.html; fi
          cp -r dist/client/. android/app/src/main/assets/public/
          npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      # Kept before the Play upload so a rejected upload still leaves you a
      # bundle to inspect or upload by hand.
      - name: Keep the .aab as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.khalimowski.focusflow
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
